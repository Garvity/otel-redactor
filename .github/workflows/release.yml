name: Build release candidates
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
      - run: make check
      - run: make vuln
      - name: Package binary and checksum
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" -o dist/otel-redactor ./cmd/otel-redactor
          cp LICENSE README.md dist/
          cp -R examples dist/
          cd dist
          tar czf "otel-redactor-${GOOS}-${GOARCH}.tar.gz" otel-redactor LICENSE README.md examples
          sha256sum "otel-redactor-${GOOS}-${GOARCH}.tar.gz" > "otel-redactor-${GOOS}-${GOARCH}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otel-redactor-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 14
